<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="dream-eye-camera.png">
<title>DreamCamera</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#070213;color:#efeaff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;
    background-image:radial-gradient(600px 300px at 15% -5%,rgba(255,47,214,.22),transparent 70%),radial-gradient(600px 300px at 90% 110%,rgba(0,229,255,.18),transparent 70%)}
  header{padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 4px;display:flex;justify-content:space-between;align-items:baseline;flex-shrink:0}
  header h1{font-size:18px;margin:0;letter-spacing:.5px;color:#ff2fd6;text-shadow:0 0 12px rgba(255,47,214,.7),0 0 30px rgba(0,229,255,.35);display:flex;align-items:center;gap:8px}
  header h1 img{width:30px;height:30px;border-radius:8px}
  header span{font-size:12px;opacity:.7;color:#7df9ff}
  main{max-width:560px;width:100%;margin:0 auto;padding:0 10px env(safe-area-inset-bottom, 0px);flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .square{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:14px;overflow:hidden;border:1px solid rgba(255,47,214,.55);box-shadow:0 0 22px rgba(255,47,214,.30),0 0 44px rgba(0,229,255,.12);flex-shrink:0;touch-action:none}
  .square video,.square canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .square canvas{display:none}
  .square.dreaming canvas{display:block}
  .square.dreaming video{display:none}
  .square .hint{position:absolute;inset:auto 0 8px 0;text-align:center;font-size:12px;opacity:.65;pointer-events:none}
  .panel{margin-top:10px;background:rgba(20,8,46,.88);border:1px solid rgba(168,85,247,.45);border-radius:14px;padding:12px;box-shadow:0 0 24px rgba(123,47,255,.25)}
  .panel h2{font-size:13px;margin:0 0 8px;color:#7df9ff;text-shadow:0 0 10px rgba(0,229,255,.6);text-transform:uppercase;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .grid label{display:block;font-size:12px;opacity:.85}
  .grid label b{display:block;font-weight:600;margin-bottom:2px}
  .grid select,.grid input[type=number],.grid input[type=text]{width:100%;background:#150a33;color:#efeaff;border:1px solid #a855f7;border-radius:8px;padding:6px;font-size:14px}
  .grid select:focus,.grid input:focus{outline:none;border-color:#00e5ff;box-shadow:0 0 10px rgba(0,229,255,.5)}
  .grid input[type=range]{width:100%;accent-color:#ff2fd6}
  .grid .val{font-size:11px;opacity:.7}
  .full{grid-column:1/-1}
  .layers{display:flex;flex-wrap:wrap;gap:6px}
  .layers label{border:1px solid rgba(0,229,255,.6);color:#c9f6ff;border-radius:20px;padding:4px 9px;font-size:12px;cursor:pointer}
  .layers input{display:none}
  .layers label.on{background:linear-gradient(135deg,#ff2fd6,#7b2fff);border-color:#ff2fd6;color:#fff;box-shadow:0 0 12px rgba(255,47,214,.5)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .row.actions button{flex:1;white-space:nowrap}
  button{position:relative;overflow:hidden;background:linear-gradient(180deg,#8a6ff0 0%,#6a4fd0 55%,#5438b8 100%);color:#fff;border:0;border-radius:999px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.25),0 4px 0 rgba(30,10,60,.55),0 8px 18px rgba(0,0,0,.45);
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
  button::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.13) 46%,rgba(0,229,255,.15) 50%,rgba(255,47,214,.15) 54%,transparent 65%);background-size:250% 100%;animation:holo 7s linear infinite;pointer-events:none}
  @keyframes holo{from{background-position:200% 0}to{background-position:-100% 0}}
  button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 3px rgba(0,0,0,.3),0 1px 0 rgba(30,10,60,.55),0 3px 8px rgba(0,0,0,.4)}
  button:disabled{opacity:.4;cursor:default;transform:none}
  button.ghost{background:linear-gradient(180deg,rgba(0,229,255,.16) 0%,rgba(0,229,255,.05) 55%,rgba(0,229,255,.02) 100%);border:1px solid rgba(0,229,255,.5);color:#bff6ff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 4px rgba(0,0,0,.2),0 3px 0 rgba(0,40,60,.5),0 6px 14px rgba(0,0,0,.4)}
  button.ghost:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 rgba(0,40,60,.5),0 3px 8px rgba(0,0,0,.35)}
  button.big{flex:1;font-size:17px;font-weight:700;padding:14px;background:linear-gradient(180deg,#ff5ce0 0%,#ff2fd6 35%,#7b2fff 70%,#00c8e5 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.3),0 5px 0 rgba(40,0,50,.6),0 10px 24px rgba(255,47,214,.45);animation:neonPulse 2.4s ease-in-out infinite}
  button.big:active{animation:none;transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.35),0 1px 0 rgba(40,0,50,.6),0 4px 12px rgba(255,47,214,.35)}
  @keyframes neonPulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.3),0 5px 0 rgba(40,0,50,.6),0 10px 22px rgba(255,47,214,.4)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.3),0 5px 0 rgba(40,0,50,.6),0 10px 32px rgba(0,229,255,.55)}}
  #status{font-size:13px;min-height:18px;margin-top:10px;color:#7df9ff}
  #status.err{color:#ff7b7b}
  #bar{height:8px;background:rgba(0,229,255,.12);border-radius:4px;overflow:hidden;visibility:hidden;margin-top:6px}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2fd6,#00e5ff);box-shadow:0 0 10px rgba(0,229,255,.7)}
  #videoBar{height:8px;background:rgba(0,229,255,.12);border-radius:4px;overflow:hidden;visibility:hidden;margin-top:6px}
  #videoBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2fd6,#00e5ff);box-shadow:0 0 10px rgba(0,229,255,.7)}
  .tabs{display:flex;gap:8px;margin:8px 0 10px;flex-shrink:0}
  .tab{flex:1;padding:10px;border-radius:999px;font-size:15px}
  .tab.on{background:linear-gradient(180deg,#ff5ce0,#ff2fd6 40%,#7b2fff 75%,#00c8e5);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.3),0 4px 0 rgba(40,0,50,.55),0 8px 18px rgba(255,47,214,.4)}
  /* The tab panes are flex columns that fill the space under the tabs, so
     the scroll area inside each one gets a real height and can scroll.
     (Without this the panes were plain blocks, the settings grew past the
     screen, and the bottom options could not be swiped to at all.) */
  #cameraTab,#videoTab{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #cameraTab[hidden],#videoTab[hidden]{display:none}
  #videoStatus{font-size:13px;min-height:18px;margin-top:10px;color:#7df9ff}
  #videoBox video,#videoBox canvas{object-fit:contain}
  #estimate{font-size:12px;opacity:.7;margin-top:4px}
  #scrollArea{flex:1;min-height:0;overflow-y:auto;padding-bottom:40px;-webkit-overflow-scrolling:touch}
  #gallery{margin-top:14px}
  #gallery h2{font-size:15px;margin:0 0 8px;color:#7df9ff;text-shadow:0 0 10px rgba(0,229,255,.6)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tile{background:rgba(20,8,46,.88);border:1px solid rgba(0,229,255,.35);border-radius:12px;overflow:hidden;padding:0;cursor:pointer;text-align:left;color:#efeaff;box-shadow:0 0 14px rgba(123,47,255,.18)}
  .tile img,.tile video{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}
  .tile .meta{padding:6px 8px;font-size:12px}
  .tile .meta small{opacity:.65;display:block}
  .tile .del{float:right;background:#a33;border-radius:6px;padding:2px 7px;font-size:12px}
  .empty{opacity:.6;font-size:13px;padding:10px}
  a{color:#b9a5ff}
</style>
</head>
<body>
<header><h1><img src="dream-eye-camera.png" alt="DreamCamera logo">DreamCamera</h1><span>deepdream camera · v1.25</span></header>
<main>
  <div class="tabs">
    <button class="tab on" id="tabCamera">📷 Camera</button>
    <button class="tab" id="tabVideo">🎬 Video</button>
  </div>
  <div id="cameraTab">
  <!-- TOP SQUARE: viewfinder. Plain: nothing drawn over the picture. Tap = shutter. -->
  <div class="square" id="viewBox" title="Tap to shoot">
    <video id="vid" autoplay muted playsinline disablepictureinpicture></video>
    <canvas id="artCv"></canvas>
    <div class="hint" id="viewHint"></div>
  </div>

  <!-- BOTTOM HALF: everything else, scrolls under the pinned viewfinder -->
  <div id="scrollArea">
  <section class="panel" aria-label="Settings">
    <h2>Settings</h2>
    <div class="row" style="margin-top:0;margin-bottom:10px">
      <button class="big" id="shootBtn">📷 Shoot &amp; Dream</button>
      <button class="ghost" id="stopBtn" disabled>Stop</button>
      <button class="ghost" id="resetBtn">Reset</button>
    </div>
    <div id="bar"><i></i></div>
    <div id="status">Starting camera…</div>
    <div id="estimate"></div>
    <div class="grid">
      <label class="full"><b>Model</b>
        <select id="modelSel"></select>
        <span class="val" id="modelNote"></span>
      </label>
      <label class="full"><b>Preset</b><select id="presetSel"></select></label>
      <label class="full"><b>Dream layers</b><span class="layers" id="layerBox"></span></label>
      <label><b>Steps / frame <span class="val" id="stepsVal"></span></b>
        <input type="range" id="steps" min="1" max="30" step="1"></label>
      <label><b>Learning rate <span class="val" id="lrVal"></span></b>
        <input type="range" id="lr" min="0.01" max="0.10" step="0.005"></label>
      <label><b>Zoom / frame <span class="val" id="zoomFactorVal"></span></b>
        <input type="range" id="zoomFactor" min="0.90" max="0.995" step="0.005"></label>
      <label><b>Zoom path</b>
        <select id="path"><option value="random" selected>Random wander</option><option value="straight">Straight · hold still</option><option value="circle">Circle</option><option value="figure8">Figure 8 · infinity</option><option value="heart">Heart</option><option value="star">Star</option><option value="lissajous">Lissajous · woven</option><option value="zigzag">Zigzag</option><option value="bounce">Bounce · DVD logo</option><option value="wave">Wave</option><option value="square">Square</option><option value="triangle">Triangle</option><option value="spiral">Spiral</option><option value="leftright">Left ↔ right</option><option value="updown">Up ↕ down</option><option value="diagonal">Diagonal</option><option value="drawn">Drawn · your shape</option></select></label>
      <div class="full"><b>Draw a path</b> <span class="val">— draw a shape, the zoom follows it</span>
        <canvas id="drawPathCv" width="140" height="140" style="width:140px;height:140px;background:#12082a;border:1px solid rgba(255,47,214,.5);border-radius:10px;touch-action:none;display:block;margin-top:6px"></canvas>
        <span class="row" style="margin-top:6px"><button class="ghost" id="drawClearBtn" type="button">Clear drawing</button><span class="val" id="drawHint"></span></span></div>
      <label><b>Path range <span class="val" id="rangeVal"></span></b>
        <input type="range" id="range" min="0" max="0.20" step="0.01"></label>
      <label><b>Path segment <span class="val" id="segFramesVal"></span></b>
        <input type="range" id="segFrames" min="4" max="20" step="1"></label>
      <label><b>Frames / run <span class="val" id="framesVal"></span></b>
        <input type="range" id="frames" min="1" max="50" step="1"></label>
      <label><b>Image size</b>
        <select id="quality"><option value="turbo">Turbo · 192</option><option value="fast">Fast · 256</option><option value="normal" selected>Normal · 384</option><option value="high">High · 512</option><option value="ultra">Ultra · 768</option><option value="max">Max · 1024</option></select></label>
      <label><b>Export size</b>
        <select id="exportSize"><option value="720p">720p</option><option value="1080p" selected>1080p</option><option value="2k">2K</option><option value="4k">4K</option><option value="8k">8K</option></select></label>
      <label><b>Photo ratio</b>
        <select id="ratio"><option value="1:1">Square · 1:1</option><option value="9:16">Portrait · 9:16</option><option value="16:9">Landscape · 16:9</option></select></label>
      <label><b>Play fps in <span class="val" id="playFpsVal"></span></b>
        <input type="range" id="playFps" min="2" max="30" step="1"></label>
      <label><b>Play fps out <span class="val" id="playFpsOutVal"></span></b>
        <input type="range" id="playFpsOut" min="2" max="30" step="1"></label>
      <label><b>Zoomerang</b>
        <select id="boomerang"><option value="1">On · zoom in, then back out</option><option value="0">Off · loop forward</option></select></label>
      <label><b>Sharpen <span class="val" id="sharpenVal"></span></b>
        <input type="range" id="sharpen" min="0" max="1" step="0.05"></label>
      <label><b>Octaves <span class="val" id="octavesVal"></span></b>
        <input type="range" id="octaves" min="1" max="3" step="1"></label>
      <label><b>Jitter <span class="val" id="jitterVal"></span></b>
        <input type="range" id="jitter" min="0" max="48" step="1"></label>
      <label><b>Color spin <span class="val" id="hueSpinVal"></span></b>
        <input type="range" id="hueSpin" min="0" max="10" step="0.5"></label>
      <label><b>Color pop <span class="val" id="saturationVal"></span></b>
        <input type="range" id="saturation" min="1" max="2.5" step="0.05"></label>
      <label><b>Pulse <span class="val" id="pulseVal"></span></b>
        <input type="range" id="pulse" min="0" max="0.8" step="0.05"></label>
      <label><b>Glow <span class="val" id="glowVal"></span></b>
        <input type="range" id="glow" min="0" max="1" step="0.05"></label>
      <label><b>Soft <span class="val" id="softVal"></span></b>
        <input type="range" id="soft" min="0" max="3" step="0.25"></label>
      <label><b>Vignette <span class="val" id="vignetteVal"></span></b>
        <input type="range" id="vignette" min="0" max="1" step="0.05"></label>
      <label><b>Fade <span class="val" id="fadeVal"></span></b>
        <input type="range" id="fade" min="0" max="1" step="0.05"></label>
      <label><b>RGB split <span class="val" id="rgbSplitVal"></span></b>
        <input type="range" id="rgbSplit" min="0" max="20" step="1"></label>
      <label><b>Slice shift <span class="val" id="sliceShiftVal"></span></b>
        <input type="range" id="sliceShift" min="0" max="1" step="0.05"></label>
      <label><b>Static <span class="val" id="staticAmtVal"></span></b>
        <input type="range" id="staticAmt" min="0" max="1" step="0.05"></label>
      <label><b>Pixelate <span class="val" id="pixelateVal"></span></b>
        <input type="range" id="pixelate" min="0" max="16" step="1"></label>
      <label><b>Invert <span class="val" id="invertAmtVal"></span></b>
        <input type="range" id="invertAmt" min="0" max="1" step="0.05"></label>
      <label><b>Camera</b>
        <select id="facing"><option value="environment">Back</option><option value="user">Front</option></select></label>
      <label><b>Model source</b>
        <select id="modelSrc"><option value="live">Live site (online)</option><option value="local">Local models/ folder</option></select></label>
      <label><b>Engine — tap to switch</b><button class="ghost" id="engineBtn" style="width:100%;text-align:left;padding:6px 10px;font-size:14px">Auto · tap to switch</button></label>
    </div>
    <div class="row actions">
      <button class="ghost" id="continueBtn" disabled>Continue +50</button>
      <button class="ghost" id="videoBtn" disabled>Save video</button>
      <button class="ghost" id="stillBtn" disabled>Save still</button>
      <button class="ghost" id="keepBtn" disabled>Keep in gallery</button>
    </div>
    <div class="row">
      <button class="ghost" id="uploadBtn" style="flex:1">Upload a photo instead</button>
      <input type="file" id="fileIn" accept="image/*" hidden>
    </div>
  </section>

  <section id="gallery">
    <h2>Gallery</h2>
    <div class="tiles" id="tiles"><div class="empty">Nothing yet. Shoot a photo and dream it.</div></div>
  </section>
  </div>
  </div>

  <!-- VIDEO TAB: deepdream a whole video (up to 15s) -->
  <div id="videoTab" hidden>
    <div class="square" id="videoBox">
      <video id="vidOut" controls playsinline></video>
      <canvas id="vidPrev" style="display:none"></canvas>
      <div class="hint" id="videoHint">Dreamed video plays here</div>
    </div>
    <div id="videoScroll" style="flex:1;min-height:0;overflow-y:auto;padding-bottom:40px;-webkit-overflow-scrolling:touch">
    <section class="panel" aria-label="Video dream">
      <h2>Video Dream</h2>
      <div class="row" style="margin-top:0;margin-bottom:10px">
        <button class="big" id="videoDreamBtn">🎬 Dream this video</button>
        <button class="ghost" id="videoStopBtn" disabled>Stop</button>
      </div>
      <div id="videoBar"><i></i></div>
      <div class="grid">
        <label class="full"><b>Video</b>
          <button class="ghost" id="videoPickBtn" style="width:100%">Choose a video (up to 15s)</button>
          <input type="file" id="videoIn" accept="video/*" hidden>
          <span class="val" id="videoInfo"></span>
        </label>
        <label class="full"><b>Preset</b>
          <select id="videoPreset">
            <option value="dreamweave" selected>Dreamweave — living style, woven frames</option>
            <option value="gentle">Gentle — light dream, every frame on its own</option>
            <option value="inception">Deep Inception — style zooms and dreams hard</option>
            <option value="transfer">Photo Transfer — your photo over the video</option>
            <option value="slowburn">Slow Burn — deep frame dream, slowly zooming</option>
            <option value="weavelight">Weave Light — gentle living style</option>
            <option value="transferdeep">Transfer Deep — heavy photo overlay</option>
            <option value="hyperweave">Hyper Weave — maximum everything</option>
            <option value="acidweave">Acid Weave — maximum trip, style dreams hard</option>
            <option value="deepvortex">Deep Vortex — frames smear into each other, style morphs every frame</option>
            <option value="meltdown">Meltdown — the style photo almost takes over completely</option>
            <option value="fractaldive">Fractal Dive — dives deepest into the photo</option>
          </select>
          <span class="val">Uses the model, layers and settings from the Camera tab.</span>
        </label>
        <label class="full" id="styleRow"><b>Style photo</b> <span class="val">— the photo the video is painted with</span>
          <button class="ghost" id="stylePickBtn" style="width:100%">Choose a style photo</button>
          <input type="file" id="styleIn" accept="image/*" hidden>
          <span class="val" id="styleInfo"></span>
        </label>
        <label class="full"><b>Mode</b>
          <select id="videoMode">
            <option value="frame">Frame Dream — dream every frame, stitch it back</option>
            <option value="transfer">Photo Transfer — a photo becomes the dream overlay</option>
            <option value="dreamweave" selected>Dreamweave — the style dreams while the video plays</option>
          </select>
          <span class="val" id="videoModeNote"></span>
        </label>
        <label><b>Process fps</b>
          <select id="videoFps"><option value="8">8 fps</option><option value="12" selected>12 fps</option><option value="16">16 fps</option></select></label>
        <label><b>Dream size</b>
          <select id="videoSize"><option value="256">256 · fast</option><option value="384">384</option><option value="512" selected>512</option><option value="768">768</option><option value="1024">1024 · max (slow)</option></select>
          <span class="val">How big each frame is dreamed. Bigger is sharper — and slower.</span></label>
        <label><b>Steps / frame <span class="val" id="videoStepsVal">3</span></b>
          <input type="range" id="videoSteps" min="1" max="5" step="1" value="3"></label>
        <label id="mixRow"><b>Style mix <span class="val" id="videoMixVal">0.70</span></b>
          <input type="range" id="videoMix" min="0" max="1" step="0.05" value="0.7"></label>
        <label id="weaveRow"><b>Weave <span class="val" id="videoWeaveVal">0.50</span></b>
          <input type="range" id="videoWeave" min="0" max="0.9" step="0.05" value="0.5"></label>
        <label id="styleZoomRow"><b>Style zoom <span class="val" id="videoStyleZoomVal">0.970</span></b>
          <input type="range" id="videoStyleZoom" min="0.90" max="0.995" step="0.005" value="0.97"></label>
        <label id="styleRateRow"><b>Style dreams</b>
          <select id="videoStyleRate"><option value="1">Every frame · fastest morph</option><option value="2">Every 2nd frame</option><option value="3" selected>Every 3rd frame</option><option value="6">Every 6th frame · slowest</option></select></label>
        <label id="styleStepsRow"><b>Style steps <span class="val" id="videoStyleStepsVal">3</span></b>
          <input type="range" id="videoStyleSteps" min="1" max="5" step="1" value="3"></label>
        <label class="full"><b>Zoom in while dreaming</b>
          <select id="videoZoom"><option value="1" selected>On · the video slowly zooms as it dreams</option><option value="0">Off · framing stays put</option></select></label>
        <label><b>Zoom speed <span class="val" id="videoZoomSpeedVal">0.998</span></b>
          <input type="range" id="videoZoomSpeed" min="0.990" max="1.000" step="0.001" value="0.998"></label>
        <label><b>Color spin <span class="val" id="videoHueSpinVal">0</span></b>
          <input type="range" id="videoHueSpin" min="0" max="10" step="0.5" value="0"></label>
        <label><b>Color pop <span class="val" id="videoSaturationVal">1.00</span></b>
          <input type="range" id="videoSaturation" min="1" max="2.5" step="0.05" value="1"></label>
        <label><b>Pulse <span class="val" id="videoPulseVal">0.00</span></b>
          <input type="range" id="videoPulse" min="0" max="0.8" step="0.05" value="0"></label>
        <label><b>Glow <span class="val" id="videoGlowVal">0.00</span></b>
          <input type="range" id="videoGlow" min="0" max="1" step="0.05" value="0"></label>
        <label><b>Soft <span class="val" id="videoSoftVal">0.00</span></b>
          <input type="range" id="videoSoft" min="0" max="3" step="0.25" value="0"></label>
        <label><b>Vignette <span class="val" id="videoVignetteVal">0.00</span></b>
          <input type="range" id="videoVignette" min="0" max="1" step="0.05" value="0"></label>
        <label><b>Fade <span class="val" id="videoFadeVal">0.00</span></b>
          <input type="range" id="videoFade" min="0" max="1" step="0.05" value="0"></label>
        <label><b>RGB split <span class="val" id="videoRgbSplitVal">0</span></b>
          <input type="range" id="videoRgbSplit" min="0" max="20" step="1" value="0"></label>
        <label><b>Slice shift <span class="val" id="videoSliceVal">0.00</span></b>
          <input type="range" id="videoSlice" min="0" max="1" step="0.05" value="0"></label>
        <label><b>Static <span class="val" id="videoStaticVal">0.00</span></b>
          <input type="range" id="videoStatic" min="0" max="1" step="0.05" value="0"></label>
        <label><b>Pixelate <span class="val" id="videoPixelateVal">0</span></b>
          <input type="range" id="videoPixelate" min="0" max="16" step="1" value="0"></label>
        <label><b>Invert <span class="val" id="videoInvertVal">0.00</span></b>
          <input type="range" id="videoInvert" min="0" max="1" step="0.05" value="0"></label>
        <label class="full"><b>Detail pass</b>
          <select id="videoDetail"><option value="0" selected>Off · dream size only</option><option value="4k">4K · real detail, dreamed tile by tile (slow)</option></select>
          <span class="val">Turns each dreamed frame into true 4K — the frame is dreamed again at 3840px, tile by tile, so the detail is real, not an upscale. A 15s clip can take over an hour; short clips are quick.</span></label>
      </div>
      <div id="videoStatus">Pick a video to begin.</div>
      <div class="row">
        <button class="ghost" id="videoSaveBtn" disabled>Save video</button>
      </div>
    </section>
    </div>
  </div>
</main>

<script src="tfjs/tf-backend-webgpu.min.js"></script>

</body>
